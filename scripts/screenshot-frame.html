<!doctype html>
<!--
  Store-listing frame for one screenshot (scripts/screenshots.ts fills the {{…}} slots):
  a caption over a phone mockup on the app's dark background, tinted with the sefer colours.
  1080×1920 = Play's 9:16 phone size. The screen is a 390×860 phone viewport (40px status bar + the 820px capture) scaled up.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; font-weight: 600; src: url({{font600}}) format('woff2'); }
  @font-face { font-family: Inter; font-weight: 800; src: url({{font800}}) format('woff2'); }

  :root {
    --bg:     #0f172a;
    --text:   #f1f5f9;
    --muted:  #94a3b8;
    --scale:  1.682;                         /* 656px screen / 390px viewport */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body {
    font-family: Inter, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding-top: 96px;
    /* Okabe-Ito sefer colours, as soft glows behind the phone */
    background:
      radial-gradient(900px 700px at 12% 30%, #0072B233, transparent 70%),
      radial-gradient(800px 700px at 92% 52%, #E69F0026, transparent 70%),
      radial-gradient(900px 800px at 20% 95%, #009E7326, transparent 70%),
      radial-gradient(700px 600px at 85% 8%,  #CC79A726, transparent 70%),
      var(--bg);
  }

  .caption {
    width: 940px; margin-bottom: 84px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--text); font-weight: 800; font-size: 76px; line-height: 1.12; letter-spacing: -1.5px;
    text-wrap: balance;
  }

  .phone {
    width: 688px; padding: 16px; border-radius: 86px;
    background: #05080f;
    box-shadow: 0 0 0 3px #2c3748, 0 40px 120px #000a, 0 0 160px #38bdf81a;
  }
  .screen { width: 656px; border-radius: 70px; overflow: hidden; background: var(--bg); }

  .status {
    /* A real phone's status bar: tall enough to clear the rounded corners and the camera. */
    position: relative; height: calc(40px * var(--scale));
    display: flex; align-items: center; justify-content: space-between; padding: 6px 60px 0 68px;
    color: var(--text); font-weight: 600; font-size: 28px;
  }
  .camera {
    position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -38%);
    border-radius: 50%; background: #000; box-shadow: 0 0 0 3px #111827;
  }
  .icons { display: flex; gap: 10px; align-items: center; }
  .shot { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="caption">{{caption}}</div>
  <div class="phone">
    <div class="screen">
      <div class="status">
        <span>9:41</span>
        <span class="camera"></span>
        <span class="icons">
          <svg width="28" height="22" viewBox="0 0 28 22" fill="currentColor"><path d="M14 4C8.8 4 4.2 6 1 9.4l2.4 2.4C6 9 9.8 7.4 14 7.4s8 1.6 10.6 4.4L27 9.4C23.8 6 19.2 4 14 4Zm0 6.6c-3.2 0-6 1.2-8 3.2l2.4 2.4c1.4-1.4 3.4-2.2 5.6-2.2s4.2.8 5.6 2.2l2.4-2.4c-2-2-4.8-3.2-8-3.2Zm0 6.6c-1.4 0-2.6.6-3.4 1.4L14 22l3.4-3.4c-.8-.8-2-1.4-3.4-1.4Z"/></svg>
          <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><path d="M20 2v18H2L20 2Z"/></svg>
          <svg width="14" height="24" viewBox="0 0 14 24" fill="currentColor"><path d="M4 0h6v2h3a1 1 0 0 1 1 1v20a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h3V0Z"/></svg>
        </span>
      </div>
      <img class="shot" src="{{shot}}">
    </div>
  </div>
</body>
</html>
