appId: com.justein.torah-tracker
productName: Torah Reading Tracker
directories:
  output: dist-electron
files:
  - dist/**
  - electron/**
  - dist-server/**
  - drizzle/**
  - seed.db
  - node_modules/**
  - package.json
publish:
  provider: github
  owner: justein230
  repo: torah-reading-tracker
  publishAutoUpdate: false   # we don't use electron-updater; skip latest*.yml manifest
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Education
  desktopName: torah-tracker.desktop
  syncDesktopName: true
mac:
  target: dmg
dmg:
  writeUpdateInfo: false   # skip generating the .blockmap; we don't use electron-updater
win:
  target: nsis
nsis:
  differentialPackage: false   # skip generating the .blockmap; we don't use electron-updater
