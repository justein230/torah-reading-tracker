when:
  - event: push
  - event: manual
  - event: cron
  - event: tag

steps:
  - name: test
    image: node:lts-slim
    commands:
      - npm ci --ignore-scripts
      - npm rebuild better-sqlite3
      - npm run typecheck
      - npm test

  - name: docker-build-push
    when:
      - branch: main
        event: [push, manual, cron]
    image: gitea.services.justein.com/homelab/container_uploader:latest
    settings:
      registry: gitea.services.justein.com
      repo: gitea.services.justein.com/justein/torah
      username: justein
      password:
        from_secret: registry_token
      tags:
        - latest
        - ${CI_COMMIT_SHA}

  # Release control: a stable vX.Y.Z tag must point at a commit on main, while
  # vX.Y.Z-dev.N / vX.Y.Z-qa.N may be cut from any branch (same rule as the GitHub
  # workflows). Steps run in order and a failure skips the rest, so a rejected tag
  # never reaches docker-build-push-tag. Don't add `depends_on` anywhere: it turns
  # the pipeline into a DAG and test/build would start in parallel.
  - name: verify-tag-on-main
    when:
      - event: tag
        ref: refs/tags/v*
    image: alpine/git
    commands:
      - |
        echo "$${CI_COMMIT_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(dev|qa)\.[0-9]+)?$' \
          || { echo "Tag $${CI_COMMIT_TAG} must look like vX.Y.Z, vX.Y.Z-qa.N or vX.Y.Z-dev.N"; exit 1; }
        case "$${CI_COMMIT_TAG}" in *-*) echo "Prerelease tag, any branch is fine"; exit 0 ;; esac
        # No credentials: this relies on the repo being public. The clone may be
        # shallow, which would make the ancestry check unreliable.
        [ "$(git rev-parse --is-shallow-repository)" = true ] && git fetch --unshallow origin
        git fetch origin main
        git merge-base --is-ancestor "$${CI_COMMIT_SHA}" origin/main \
          || { echo "Stable tag $${CI_COMMIT_TAG} ($${CI_COMMIT_SHA}) is not on main, refusing to publish a release image"; exit 1; }

  # Version tags (including prereleases like v1.1.2-dev.0) get an image tagged
  # with the version only; `latest` stays owned by the main-branch step above.
  - name: docker-build-push-tag
    when:
      - event: tag
        ref: refs/tags/v*
    image: gitea.services.justein.com/homelab/container_uploader:latest
    settings:
      registry: gitea.services.justein.com
      repo: gitea.services.justein.com/justein/torah
      username: justein
      password:
        from_secret: registry_token
      tags:
        - ${CI_COMMIT_TAG}

