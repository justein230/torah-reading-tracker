when:
  - event: tag
    evaluate: CI_COMMIT_TAG matches "^v"
  - event: manual

steps:
  - name: electron-windows
    image: electronuserland/builder:wine
    commands:
      - npm ci --ignore-scripts
      - npm run build
      - npx electron-builder --win --publish never

