name: web-deploy

# Ported from .woodpecker/web-deploy.yml
# Runs tests on every push. The Docker image is built + pushed to GHCR only for
# version tags: vX.Y.Z (also tagged :latest), vX.Y.Z-qa.N (:qa) and vX.Y.Z-dev.N (:dev).
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  # NOTE: no `pull_request` trigger — fork-PR workflows are disallowed for now
  # (Option A: contributions are merged via Gitea). To CI contributor PRs later
  # (Option B), add `pull_request:` here — use `pull_request`, never
  # pull_request_target, so fork PRs stay on a read-only token with no secrets.
  workflow_dispatch:      # replaces Woodpecker "event: manual"

# Least privilege by default: every job gets a read-only token unless it explicitly
# opts into more (only docker-build-push does, and only for a version tag).
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      # better-sqlite3's own install is `prebuild-install || node-gyp rebuild`: it
      # downloads a prebuilt binary in seconds. `npm rebuild` bypasses that script
      # (binding.gyp present) and always node-gyp-compiles from source (~90s), so call
      # prebuild-install directly and fall back to a source build only if none exists.
      - name: Build better-sqlite3 (prefer prebuilt binary)
        working-directory: node_modules/better-sqlite3
        run: ../.bin/prebuild-install || npm run build-release
      - run: npm run typecheck
      - run: npm test

  # The image is built for amd64 and arm64 on native runners (no QEMU emulation):
  # docker-verify-tag gates the release, docker-build pushes one untagged image per
  # platform by digest, and docker-merge joins them into one multi-arch manifest
  # carrying the version tags.
  docker-verify-tag:
    needs: test
    # Only version tags build an image. Excluding pull_request explicitly is
    # defense in depth for if a `pull_request` trigger is added later.
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # full history so the main-ancestry check below can see origin/main

      - name: Validate tag format
        run: |
          [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(dev|qa)\.[0-9]+)?$ ]] || {
            echo "::error::Tag ${{ github.ref_name }} must look like vX.Y.Z, vX.Y.Z-qa.N or vX.Y.Z-dev.N."
            exit 1
          }

      # Dev/QA prerelease tags can be cut from any branch for testing. A stable
      # vX.Y.Z tag must point at a commit that's on main (same rule as platform-builds.yml).
      - name: Verify stable tag is on main
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main || {
            echo "::error::Tag ${{ github.ref_name }} (${{ github.sha }}) is not on main — refusing to publish a release image from another branch."
            exit 1
          }

  docker-build:
    needs: docker-verify-tag
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, pair: linux-amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, pair: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions: &ghcr-permissions
      contents: read
      packages: write       # required to push to GHCR
    steps:
      - uses: actions/checkout@v7

      - &ghcr-login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no secret to create

      - uses: docker/setup-buildx-action@v4

      # Used here for the OCI labels and in docker-merge for the tags.
      - &meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=qa,enable=${{ contains(github.ref_name, '-qa.') }}
            type=raw,value=dev,enable=${{ contains(github.ref_name, '-dev.') }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed by digest only; docker-merge applies the tags.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Separate scopes, or the two platforms overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pair }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions: *ghcr-permissions
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - *ghcr-login

      - uses: docker/setup-buildx-action@v4

      - *meta

      # One manifest list pointing at both platform images, pushed under every tag.
      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # Uncomment to enable automatic deployment over SSH (mirrors the Woodpecker deploy step).
  # deploy:
  #   needs: docker-merge
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
