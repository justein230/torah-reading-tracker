  #       with:
  #         host: ${{ secrets.DEPLOY_HOST }}
  #         username: ${{ secrets.DEPLOY_USER }}
  #         key: ${{ secrets.DEPLOY_SSH_KEY }}
  #         port: 22
  #         script: |
  #           docker compose -f /opt/torah/docker-compose.yml pull
  #           docker compose -f /opt/torah/docker-compose.yml up -d --remove-orphans
  #           docker image prune -f
