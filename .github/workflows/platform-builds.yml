name: platform-builds

# Ported from .woodpecker/platform-builds.yml
# Builds the Electron desktop artifacts on version tags (v*) or manual dispatch,
# and publishes them straight to a GitHub Release when triggered by a tag.
#
# electron-builder.yml sets publish.publishAutoUpdate: false, so the built-in
# GitHub publish below uploads only the installer artifacts — not the
# electron-updater metadata (latest*.yml, .blockmap files) we don't use.
on:
  push:
    tags:
      - "v*"               # replaces evaluate: CI_COMMIT_TAG matches "^v"
  workflow_dispatch:       # replaces Woodpecker "event: manual"

permissions:
  contents: write   # electron-builder needs this to create/upload GitHub Release assets

jobs:
  electron-windows:
    # GitHub's Windows runner builds natively — no wine container needed
    # (the Woodpecker job used electronuserland/builder:wine on Linux).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build better-sqlite3 (prefer prebuilt binary)
        working-directory: node_modules/better-sqlite3
        run: ../.bin/prebuild-install || npm run build-release
      - run: node scripts/build-electron.mjs
      - run: npx electron-rebuild
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - uses: actions/upload-artifact@v7
        with:
          name: torah-windows
          path: dist-electron/*.exe
          if-no-files-found: warn

  electron-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build better-sqlite3 (prefer prebuilt binary)
        working-directory: node_modules/better-sqlite3
        run: ../.bin/prebuild-install || npm run build-release
      - run: node scripts/build-electron.mjs
      - run: npx electron-rebuild
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no signing cert configured; build unsigned
        run: npx electron-builder --mac --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - uses: actions/upload-artifact@v7
        with:
          name: torah-mac
          path: dist-electron/*.dmg
          if-no-files-found: warn

  electron-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build better-sqlite3 (prefer prebuilt binary)
        working-directory: node_modules/better-sqlite3
        run: ../.bin/prebuild-install || npm run build-release
      - name: Install rpmbuild (needed for the rpm target)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - run: node scripts/build-electron.mjs
      - run: npx electron-rebuild
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - uses: actions/upload-artifact@v7
        with:
          name: torah-linux
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
          if-no-files-found: warn

