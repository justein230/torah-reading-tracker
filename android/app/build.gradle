apply plugin: 'com.android.application'
apply plugin: 'com.mikepenz.aboutlibraries.plugin'

// Lists the app's dependencies with their license texts for licenses/native/android.md
// (see docs/LICENSES.md). Run through `npm run licenses:android`; nothing here ships in the app.
aboutLibraries {
    offlineMode = true
    // Explicit property access: in Groovy, `collect { }` would call Groovy's own Object.collect(Closure).
    collect.fetchRemoteLicense = false
    export {
        outputFile = layout.buildDirectory.file("aboutlibraries.json")
        prettyPrint = true
    }
}

// Release signing (upload key) comes from android/keystore.properties, which is gitignored and
// written by hand once (docs/ANDROID_RELEASE.md). Without it, release builds are left
// unsigned and debug builds are unaffected.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// versionName/versionCode come from package.json's version, packed like src/utils/appVersion.ts:
// 1.2.0 → 10200 (tests/unit/appVersion.test.ts checks the two agree). Read here rather than passed
// in, so every build gets it: npm run android:release, Android Studio's signed bundle, debug runs.
// A prerelease (1.2.1-dev.0) keeps its full name and 1.2.1's code for debug builds, but release
// builds refuse it: on Play it would share 1.2.1's code.
def appVersion     = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version.trim()
def versionParts   = appVersion =~ /^(\d+)\.(\d+)\.(\d+)(-.+)?$/
if (!versionParts.matches()) {
    throw new GradleException("package.json version \"${appVersion}\" is not X.Y.Z or X.Y.Z-prerelease")
}
def (major, minor, patch) = (1..3).collect { versionParts.group(it) as int }
if (minor >= 100 || patch >= 100) {
    throw new GradleException("package.json version \"${appVersion}\": minor and patch must each be below 100 to fit the versionCode scheme")
}
def appVersionCode = major * 10000 + minor * 100 + patch
def isPrerelease   = versionParts.group(4) != null

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild' && isPrerelease) {
        task.doFirst {
            throw new GradleException("package.json version \"${appVersion}\" is a prerelease; bump it with npm version patch/minor/major before a release build")
        }
    }
}

android {
    namespace = "com.justein.torahtracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.justein.torahtracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile     file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
